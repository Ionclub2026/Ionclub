<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ION CLUB Lessons</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,sans-serif;background:#f2f2f7;}
header{background:#000;border-bottom:3px solid #e31e24;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
header img{height:38px;}
header span{color:#e31e24;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.tabs{display:flex;background:#111;}
.tab{flex:1;padding:14px 4px;border:none;background:none;color:#555;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent;}
.tab.on{color:#fff;border-bottom:3px solid #e31e24;}
.page{display:none;padding:16px;padding-bottom:50px;}
.page.on{display:block;}
h3{font-size:11px;font-weight:700;color:#888;letter-spacing:1.5px;text-transform:uppercase;margin:20px 0 8px 4px;}
h3:first-child{margin-top:4px;}
.grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
.pill{padding:10px 14px;background:#fff;border:2px solid #e5e5ea;border-radius:10px;font-size:15px;font-weight:500;color:#000;min-width:48px;text-align:center;cursor:pointer;-webkit-appearance:none;}
.pill.sel{background:#e31e24!important;border-color:#e31e24!important;color:#fff!important;font-weight:700;}
.pill.dur{min-width:72px;}

/* PRODUCT CARDS */
.product-grid{display:flex;gap:12px;margin-bottom:4px;}
.product-card{
  flex:1;
  background:#e8e8e8;
  border-radius:12px;
  padding:14px;
  cursor:pointer;
  border:2px solid #e8e8e8;
  position:relative;
  min-height:110px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  -webkit-appearance:none;
  border:none;
  text-align:left;
}
.product-card.sel{
  border:2px solid #e31e24;
  background:#e8e8e8;
}
.product-card-title{
  font-size:13px;
  font-weight:700;
  color:#000;
  line-height:1.3;
  margin-bottom:4px;
}
.product-card-sub{
  font-size:11px;
  color:#888;
  margin-bottom:10px;
}
.product-card-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.product-card-avail{
  font-size:12px;
  font-weight:700;
  color:#e31e24;
}
.product-card-price{
  display:flex;
  align-items:center;
  gap:6px;
}
.product-card-price span{
  font-size:22px;
  font-weight:800;
  color:#e31e24;
}
.product-card-price svg{
  color:#e31e24;
}
.product-card.sel .product-card-title::before{
  content:'✓ ';
  color:#e31e24;
}

.namebox{background:#fff;border-radius:10px;padding:14px 16px;}
.namebox input{width:100%;border:none;outline:none;font-size:17px;font-family:-apple-system,sans-serif;background:none;color:#000;}
.namebox input::placeholder{color:#c7c7cc;}
.btn-main{display:block;width:100%;padding:18px;background:#e31e24;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;margin-top:24px;-webkit-appearance:none;}
.btn-main:active{background:#b01519;}
.mrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
.mbtn{flex-shrink:0;padding:10px 16px;background:#fff;border:2px solid #e5e5ea;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;color:#000;white-space:nowrap;-webkit-appearance:none;}
.mbtn.on{background:#e31e24;border-color:#e31e24;color:#fff;}
.totbox{background:#000;border-radius:12px;padding:14px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.totbox span{color:#666;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
.totbox strong{color:#e31e24;font-size:26px;font-weight:800;}
.dayhdr{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:1px;padding:10px 2px 5px;}
.card{background:#fff;border-radius:12px;padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;border-left:4px solid #e31e24;}
.cinfo{flex:1;}
.cname{font-size:15px;font-weight:600;}
.cmeta{font-size:13px;color:#888;margin-top:2px;}
.ctot{font-size:17px;font-weight:700;color:#e31e24;white-space:nowrap;}
.cbtns{display:flex;flex-direction:column;gap:4px;}
.cedit{background:none;border:none;color:#888;font-size:16px;cursor:pointer;padding:2px 6px;}
.cdel{background:none;border:none;color:#ccc;font-size:18px;cursor:pointer;padding:2px 6px;}
.empty{text-align:center;padding:50px 20px;color:#aaa;font-size:16px;}
.btn-pdf{display:block;width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;margin-bottom:14px;}

.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:500;display:none;align-items:center;justify-content:center;}
.modal-overlay.on{display:flex;}
.modal{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:400px;}
.modal h4{font-size:17px;font-weight:700;margin-bottom:16px;}
.modal input{width:100%;border:2px solid #e5e5ea;border-radius:10px;padding:12px 14px;font-size:16px;font-family:-apple-system,sans-serif;outline:none;margin-bottom:12px;}
.modal input:focus{border-color:#e31e24;}
.modal-btns{display:flex;gap:8px;}
.modal-btns button{flex:1;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;}
.btn-cancel{background:#f2f2f7;color:#000;}
.btn-save{background:#e31e24;color:#fff;}

#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:12px 24px;border-radius:20px;font-size:14px;font-weight:600;border-left:4px solid #e31e24;display:none;z-index:999;white-space:nowrap;}
</style>
</head>

    <button type="button" class="pill" id="day21" onclick="pickDay(21)">21</button>
    <button type="button" class="pill" id="day22" onclick="pickDay(22)">22</button>
    <button type="button" class="pill" id="day23" onclick="pickDay(23)">23</button>
    <button type="button" class="pill" id="day24" onclick="pickDay(24)">24</button>
    <button type="button" class="pill" id="day25" onclick="pickDay(25)">25</button>
    <button type="button" class="pill" id="day26" onclick="pickDay(26)">26</button>
    <button type="button" class="pill" id="day27" onclick="pickDay(27)">27</button>
    <button type="button" class="pill" id="day28" onclick="pickDay(28)">28</button>
    <button type="button" class="pill" id="day29" onclick="pickDay(29)">29</button>
    <button type="button" class="pill" id="day30" onclick="pickDay(30)">30</button>
    <button type="button" class="pill" id="day31" onclick="pickDay(31)">31</button>
    
  </div>

  <h3>Product</h3>
  <div class="product-grid">
    <button type="button" class="product-card" id="pA" onclick="pickProduct('Semi-Private Lesson')">
      <div>
        <div class="product-card-title">Kitesurf Discovery Course (6.00 hours) - Semi-Private</div>
        <div class="product-card-sub">3 D&iacute;as</div>
      </div>
      <div class="product-card-footer">
        <span class="product-card-avail">18 left</span>
        <div class="product-card-price">
          <span>415&euro;</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        </div>
      </div>
    </button>
    <button type="button" class="product-card" id="pB" onclick="pickProduct('Private Lesson')">
      <div>
        <div class="product-card-title">Kitesurf Discovery Course (6.00 hours) - Private</div>
        <div class="product-card-sub">3 D&iacute;as</div>
      </div>
      <div class="product-card-footer">
        <span class="product-card-avail">8 left</span>
        <div class="product-card-price">
          <span>595&euro;</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        </div>
      </div>
    </button>
  </div>

  <h3>Student Name</h3>
  <div class="namebox">
    <input type="text" id="fname" placeholder="Enter name..." autocomplete="off" autocorrect="off" autocapitalize="words">
  </div>
  <h3>Duration</h3>
  <div class="grid">
    <button type="button" class="pill dur" id="d20"  onclick="pickDur(20)">20 min</button>
    <button type="button" class="pill dur" id="d40"  onclick="pickDur(40)">40 min</button>
    <button type="button" class="pill dur" id="d60"  onclick="pickDur(60)">60 min</button>
    <button type="button" class="pill dur" id="d80"  onclick="pickDur(80)">80 min</button>
    <button type="button" class="pill dur" id="d100" onclick="pickDur(100)">100 min</button>
    <button type="button" class="pill dur" id="d120" onclick="pickDur(120)">120 min</button>
    <button type="button" class="pill dur" id="d140" onclick="pickDur(140)">140 min</button>
    <button type="button" class="pill dur" id="d160" onclick="pickDur(160)">160 min</button>
    <button type="button" class="pill dur" id="d180" onclick="pickDur(180)">180 min</button>
  </div>
  <button type="button" class="btn-main" onclick="doAdd()">ADD TO SCHEDULE</button>
</div>

<div id="page-sch" class="page">
  <div id="sch-content"></div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h4>Edit Lesson</h4>
    <input type="text" id="edit-name" placeholder="Student name">
    <div class="modal-btns">
      <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button type="button" class="btn-save" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
var sMonth=null,sDay=null,sProduct=null,sDur=null;
var MN={6:'June',7:'July',8:'August',9:'September'};
var PR={'Private Lesson':99.16,'Semi-Private Lesson':69.16};
var DAYS={6:30,7:31,8:31,9:30};
var curM=6;
var editM=null,editI=null;
var data={6:[],7:[],8:[],9:[]};
try{var s=localStorage.getItem('ion26');if(s){var p=JSON.parse(s);if(p&&p[6])data=p;}}catch(e){}
function save(){try{localStorage.setItem('ion26',JSON.stringify(data));}catch(e){}}

var now=new Date();
var tm=now.getMonth()+1;
var td=now.getDate();
if(tm<6||tm>9)tm=6;
curM=tm;sMonth=tm;sDay=td;
window.onload=function(){
  document.getElementById('m'+tm).classList.add('sel');
  document.getElementById('day'+td).classList.add('sel');
};

function pickMonth(m){
  sMonth=m;
  [6,7,8,9].forEach(function(x){document.getElementById('m'+x).classList.remove('sel');});
  document.getElementById('m'+m).classList.add('sel');
  for(var i=1;i<=31;i++){var el=document.getElementById('day'+i);if(el)el.style.display=i<=DAYS[m]?'':'none';}
  if(sDay>DAYS[m]){sDay=1;for(var i=1;i<=31;i++){var el=document.getElementById('day'+i);if(el)el.classList.remove('sel');}document.getElementById('day1').classList.add('sel');}
}

function pickDay(d){
  sDay=d;
  for(var i=1;i<=31;i++){var el=document.getElementById('day'+i);if(el)el.classList.remove('sel');}
  document.getElementById('day'+d).classList.add('sel');
}

function pickProduct(p){
  sProduct=p;
  document.getElementById('pA').classList.remove('sel');
  document.getElementById('pB').classList.remove('sel');
  document.getElementById(p==='Semi-Private Lesson'?'pA':'pB').classList.add('sel');
}

function pickDur(d){
  sDur=d;
  [20,40,60,80,100,120,140,160,180].forEach(function(x){document.getElementById('d'+x).classList.remove('sel');});
  document.getElementById('d'+d).classList.add('sel');
}

function goPage(p){
  ['add','sch'].forEach(function(x){
    document.getElementById('page-'+x).classList.remove('on');
    document.getElementById('tab-'+x).classList.remove('on');
  });
  document.getElementById('page-'+p).classList.add('on');
  document.getElementById('tab-'+p).classList.add('on');
  if(p==='sch')renderSch();
}

function doAdd(){
  var n=document.getElementById('fname').value.trim();
  if(!sMonth)return toast('Tap a month');
  if(!sDay)return toast('Tap a day');
  if(!sProduct)return toast('Tap a product');
  if(!n)return toast('Enter a name');
  if(!sDur)return toast('Tap a duration');
  var m=('0'+sMonth).slice(-2),d=('0'+sDay).slice(-2);
  data[sMonth].push({datum:'2026-'+m+'-'+d,product:sProduct,name:n,dur:sDur,price:PR[sProduct]});
  data[sMonth].sort(function(a,b){return a.datum>b.datum?1:-1;});
  save();
  document.getElementById('fname').value='';
  sProduct=null;sDur=null;
  document.getElementById('pA').classList.remove('sel');
  document.getElementById('pB').classList.remove('sel');
  [20,40,60,80,100,120,140,160,180].forEach(function(x){document.getElementById('d'+x).classList.remove('sel');});
  curM=sMonth;
  toast('Added to '+MN[sMonth]+'!');
  setTimeout(function(){goPage('sch');},600);
}

function openModal(m,i){
  editM=m;editI=i;
  document.getElementById('edit-name').value=data[m][i].name;
  document.getElementById('modal').classList.add('on');
  setTimeout(function(){document.getElementById('edit-name').focus();},100);
}
function closeModal(){document.getElementById('modal').classList.remove('on');editM=null;editI=null;}
function saveEdit(){
  var n=document.getElementById('edit-name').value.trim();
  if(!n)return toast('Enter a name');
  data[editM][editI].name=n;save();closeModal();renderSch();toast('Name updated!');
}

function renderSch(){
  var rows=data[curM],html='';
  html+='<div class="mrow">';
  [6,7,8,9].forEach(function(m){
    var cnt=data[m].length,on=m===curM?' on':'';
    html+='<button type="button" class="mbtn'+on+'" onclick="setM('+m+')">'+MN[m]+(cnt?' ('+cnt+')':'')+'</button>';
  });
  html+='</div>';
  if(!rows.length){html+='<div class="empty">No lessons in '+MN[curM]+' yet.</div>';document.getElementById('sch-content').innerHTML=html;return;}
  var tot=0;
  rows.forEach(function(r){tot+=(r.dur/60)*r.price;});
  html+='<div class="totbox"><span>Monthly Total</span><strong>&euro;'+tot.toFixed(2)+'</strong></div>';
  html+='<div class="totbox" style="margin-bottom:12px;background:#1a1a1a;"><span>25% Commission</span><strong style="color:#ff6b6b;">&euro;'+(tot*0.25).toFixed(2)+'</strong></div>';
  html+='<button type="button" class="btn-pdf" onclick="window.print()">&darr; Export PDF</button>';
  var grp={};
  rows.forEach(function(r,i){if(!grp[r.datum])grp[r.datum]=[];grp[r.datum].push({r:r,i:i});});
  var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  Object.keys(grp).sort().forEach(function(dt){
    var pts=dt.split('-'),dobj=new Date(+pts[0],+pts[1]-1,+pts[2]);
    html+='<div class="dayhdr">'+WD[dobj.getDay()]+' '+parseInt(pts[2])+' '+MN[+pts[1]]+'</div>';
    grp[dt].forEach(function(x){
      var t=(x.r.dur/60)*x.r.price;
      html+='<div class="card"><div class="cinfo"><div class="cname">'+x.r.name+'</div>'
          +'<div class="cmeta">'+x.r.product+' &middot; '+x.r.dur+' min</div></div>'
          +'<div class="ctot">&euro;'+t.toFixed(2)+'</div>'
          +'<div class="cbtns">'
          +'<button type="button" class="cedit" onclick="openModal('+curM+','+x.i+')">&#9998;</button>'
          +'<button type="button" class="cdel" onclick="del('+curM+','+x.i+')">&#215;</button>'
          +'</div></div>';
    });
  });
  document.getElementById('sch-content').innerHTML=html;
}

function setM(m){curM=m;renderSch();}
function del(m,i){data[m].splice(i,1);save();renderSch();}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none';},2200);}
</script>
</body>
</html>
