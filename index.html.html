<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ION CLUB Lessons</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,sans-serif;background:#f2f2f7;}
header{background:#000;border-bottom:3px solid #e31e24;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
header img{height:38px;}
header span{color:#e31e24;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.tabs{display:flex;background:#111;}
.tab{flex:1;padding:14px 4px;border:none;background:none;color:#555;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent;}
.tab.on{color:#fff;border-bottom:3px solid #e31e24;}
.page{display:none;padding:16px;padding-bottom:60px;}
.page.on{display:block;}
h3{font-size:11px;font-weight:700;color:#888;letter-spacing:1.5px;text-transform:uppercase;margin:20px 0 8px 4px;}
h3:first-child{margin-top:4px;}
.grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
.pill{padding:10px 14px;background:#fff;border:2px solid #e5e5ea;border-radius:10px;font-size:15px;font-weight:500;color:#000;min-width:48px;text-align:center;cursor:pointer;}
.pill.sel{background:#e31e24;border-color:#e31e24;color:#fff;font-weight:700;}
.pill.dur{min-width:72px;}
.product-grid{display:flex;flex-wrap:nowrap;gap:8px;margin-bottom:4px;}
.product-card{flex:1;min-width:0;}
.product-card{flex:1;background:#e8e8e8;border-radius:12px;padding:14px;border:2px solid #e8e8e8;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;}
.product-card.sel{border-color:#e31e24;}
.pct{font-size:13px;font-weight:700;color:#000;line-height:1.3;margin-bottom:4px;}
.pcs{font-size:11px;color:#888;margin-bottom:8px;}
.pcf{display:flex;justify-content:space-between;align-items:center;}
.pca{font-size:12px;font-weight:700;color:#e31e24;}
.pcp{font-size:20px;font-weight:800;color:#e31e24;}
.product-card.sel .pct::before{content:'✓ ';color:#e31e24;}
.namebox{background:#fff;border-radius:10px;padding:14px 16px;}
.namebox input{width:100%;border:none;outline:none;font-size:17px;font-family:-apple-system,sans-serif;background:none;color:#000;}
.btn-main{display:block;width:100%;padding:18px;background:#e31e24;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;margin-top:24px;}
.mrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
.mbtn{flex-shrink:0;padding:10px 16px;background:#fff;border:2px solid #e5e5ea;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;color:#000;white-space:nowrap;}
.mbtn.on{background:#e31e24;border-color:#e31e24;color:#fff;}
.totbox{background:#000;border-radius:12px;padding:14px 18px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.totbox span{color:#666;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
.totbox strong{color:#e31e24;font-size:26px;font-weight:800;}
.commbox{background:#1a1a1a;border-radius:12px;padding:14px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.commbox span{color:#666;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
.commbox strong{color:#fff;font-size:26px;font-weight:800;}
.dayhdr{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:1px;padding:10px 2px 5px;}
.card{background:#fff;border-radius:12px;padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;border-left:4px solid #e31e24;}
.cinfo{flex:1;}
.cname{font-size:15px;font-weight:600;}
.cmeta{font-size:13px;color:#888;margin-top:2px;}
.ctot{font-size:17px;font-weight:700;color:#e31e24;white-space:nowrap;}
.cbtns{display:flex;flex-direction:column;gap:4px;}
.cedit,.cdel{background:none;border:none;cursor:pointer;padding:2px 6px;font-size:16px;}
.cedit{color:#888;}
.cdel{color:#ccc;}
.empty{text-align:center;padding:50px 20px;color:#aaa;font-size:16px;}
.btn-pdf{display:block;width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;margin-bottom:14px;}
.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center;}
.mo.on{display:flex;}
.mb{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:380px;}
.mb h4{font-size:17px;font-weight:700;margin-bottom:14px;}
.mb input{width:100%;border:2px solid #e5e5ea;border-radius:10px;padding:12px;font-size:16px;outline:none;margin-bottom:12px;font-family:-apple-system,sans-serif;}
.mp{display:flex;gap:8px;margin-bottom:12px;}
.mp button{flex:1;padding:11px 6px;border:2px solid #e5e5ea;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:#000;}
.mp button.sel{background:#e31e24;border-color:#e31e24;color:#fff;}
.mbb{display:flex;gap:8px;}
.mbb button{flex:1;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;}
.mbc{background:#f2f2f7;color:#000;}
.mbs{background:#e31e24;color:#fff;}
#msg{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:12px 24px;border-radius:20px;font-size:14px;font-weight:600;border-left:4px solid #e31e24;display:none;z-index:999;white-space:nowrap;}
.ph{display:none;}
@media print{
  @page{size:A4 portrait;margin:8mm 10mm;}
  header,.tabs,.mrow,.btn-pdf,.cdel,.cedit,#msg,.btn-main,.mo{display:none!important;}
  .page{display:block!important;padding:0;}
  #page-add{display:none!important;}
  .totbox,.commbox{-webkit-print-color-adjust:exact;print-color-adjust:exact;border-radius:4px;padding:8px 12px;margin-bottom:4px;}
  .card{padding:4px 8px;margin-bottom:2px;border-radius:0;page-break-inside:avoid;}
  .cname{font-size:9pt;}.cmeta{font-size:7pt;}.ctot{font-size:9pt;}
  .dayhdr{font-size:7pt;padding:3px 2px 1px;}
  .totbox strong,.commbox strong{font-size:12pt;}
  .ph{display:flex!important;justify-content:space-between;align-items:center;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px;}
  .ph img{height:26px;}
  .ph h2{font-size:11pt;font-weight:800;text-transform:uppercase;}
}
</style>
</head>

<script>

var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

var sM=null,sD=null,sP=null,sDr=null;
var curM=6,eM=null,eI=null,eP=null;

function save(){try{localStorage.setItem('ion26',JSON.stringify(data));}catch(e){}}

// Init today
var now=new Date();
var tm=now.getMonth()+1; if(tm<6||tm>9)tm=6;
var td=now.getDate();
curM=tm; sM=tm; sD=td;

// Attach all button events on load
document.addEventListener('DOMContentLoaded', function() {
  // Month buttons
  [6,7,8,9].forEach(function(m) {
    document.getElementById('m'+m).addEventListener('click', function() {
      sM=m;
      [6,7,8,9].forEach(function(x){document.getElementById('m'+x).classList.remove('sel');});
      this.classList.add('sel');
      for(var i=1;i<=31;i++){var el=document.getElementById('day'+i);if(el)el.style.display=i<=DAYS[m]?'':'none';}
      if(sD>DAYS[m]){sD=1;selDay(1);}
    });
  });

  // Day buttons
  for(var d=1;d<=31;d++){
    (function(day){
      var el=document.getElementById('day'+day);
      if(el) el.addEventListener('click', function(){sD=day;selDay(day);});
    })(d);
  }

  // Product buttons
  document.getElementById('pA').addEventListener('click', function(){
    sP='Semi-Private Lesson';
    document.getElementById('pA').classList.add('sel');
    document.getElementById('pB').classList.remove('sel');
    document.getElementById('pC').classList.remove('sel');
  });
  document.getElementById('pB').addEventListener('click', function(){
    sP='Private Lesson';
    document.getElementById('pB').classList.add('sel');
    document.getElementById('pA').classList.remove('sel');
    document.getElementById('pC').classList.remove('sel');
  });
  document.getElementById('pC').addEventListener('click', function(){
    sP='Service';
    document.getElementById('pC').classList.add('sel');
    document.getElementById('pA').classList.remove('sel');
    document.getElementById('pB').classList.remove('sel');
  });

  // Duration buttons
  [20,30,40,60,80,90,100,120,140,160,180].forEach(function(d){

      sDr=d;

      this.classList.add('sel');

  document.getElementById('btn-add').addEventListener('click', doAdd);

  document.getElementById('tab-add').addEventListener('click', function(){goPage('add');});

      var i=parseInt(e.target.getAttribute('data-i'));
      openModal(m,i);
    }
    if(e.target.classList.contains('cdel')){
      var m=parseInt(e.target.getAttribute('data-m'));
      var i=parseInt(e.target.getAttribute('data-i'));
      data[m].splice(i,1); save(); renderSch();

    if(e.target.classList.contains('btn-pdf')){
      window.print();
    }

  document.getElementById('btn-save').addEventListener('click', saveEdit);

function selDay(d){
  for(var i=1;i<=31;i++){var el=document.getElementById('day'+i);if(el)el.classList.remove('sel');}
  var el=document.getElementById('day'+d); if(el)el.classList.add('sel');
}

function goPage(p){
  document.getElementById('page-add').classList.toggle('on', p==='add');
  document.getElementById('page-sch').classList.toggle('on', p==='sch');
  document.getElementById('tab-add').classList.toggle('on', p==='add');
  document.getElementById('tab-sch').classList.toggle('on', p==='sch');
  if(p==='sch') renderSch();
}

function doAdd(){
  var n=document.getElementById('fname').value.trim();
  // Auto-detect product from selected card if sP is null
  if(!sP){
    if(document.getElementById('pA').classList.contains('sel')) sP='Semi-Private Lesson';
    else if(document.getElementById('pB').classList.contains('sel')) sP='Private Lesson';
    else if(document.getElementById('pC').classList.contains('sel')) sP='Service';
  }
  // Auto-detect duration if sDr is null
  if(!sDr){
    [20,30,40,60,80,90,100,120,140,160,180].forEach(function(x){
      if(document.getElementById('d'+x).classList.contains('sel')) sDr=x;
    });
  }
  if(!sM){showMsg('Tap a month');return;}
  if(!sD){showMsg('Tap a day');return;}
  if(!sP){showMsg('Tap a product');return;}
  if(!n){showMsg('Enter a name');return;}
  if(!sDr){showMsg('Tap a duration');return;}
  var mm=('0'+sM).slice(-2), dd=('0'+sD).slice(-2);
  var lesson={datum:'2026-'+mm+'-'+dd, product:sP, name:n, dur:sDr, price:PR[sP]};
  data[sM].push(lesson);
  data[sM].sort(function(a,b){return a.datum>b.datum?1:-1;});
  save();
  document.getElementById('fname').value='';
  sP=null; sDr=null;
  document.getElementById('pA').classList.remove('sel');
  document.getElementById('pB').classList.remove('sel');
  document.getElementById('pC').classList.remove('sel');
  [20,30,40,60,80,90,100,120,140,160,180].forEach(function(x){document.getElementById('d'+x).classList.remove('sel');});
  curM=sM;
  showMsg('Added to '+MN[sM]+'!');
  setTimeout(function(){goPage('sch');},700);
}

function openModal(m,i){
  eM=m;eI=i;eP=data[m][i].product;
  document.getElementById('en').value=data[m][i].name;
  document.getElementById('ep1').classList.toggle('sel',eP==='Semi-Private Lesson');
  document.getElementById('ep2').classList.toggle('sel',eP==='Private Lesson');
  document.getElementById('ep3').classList.toggle('sel',eP==='Service');
  document.getElementById('modal').classList.add('on');
  setTimeout(function(){document.getElementById('en').focus();},100);
}
function closeModal(){document.getElementById('modal').classList.remove('on');}
function saveEdit(){
  var n=document.getElementById('en').value.trim();
  if(!n){showMsg('Enter a name');return;}
  data[eM][eI].name=n;
  data[eM][eI].product=eP;
  data[eM][eI].price=PR[eP];
  save();closeModal();renderSch();showMsg('Updated!');
}
function showMsg(t){var el=document.getElementById('msg');el.textContent=t;el.style.display='block';setTimeout(function(){el.style.display='none';},2200);}
